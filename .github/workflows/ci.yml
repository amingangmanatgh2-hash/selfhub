name: CI

on:
  push:
    branches: [Main, main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: نصب وابستگی‌ها
        run: npm ci
      - name: بررسی تایپ‌ها (src + test)
        run: npm run typecheck
      - name: تست‌ها
        run: npm test
      - name: بیلد (dry-run deploy)
        run: npx wrangler deploy --dry-run --outdir dist
